name: Core and numerical contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install PyYAML
      - name: Fetch pinned tidyHEBO
        env:
          PYTHONPATH: src
        run: python -c "from bo_benchmark_setup.sources import prepare_sources; prepare_sources(olympus=False)"
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e vendor/tidyhebo -e ".[analysis]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
