name: tidyhebo-bayesmark
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=25.3
  - numpy=2.2.6
  - scipy=1.15.2
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - jupyterlab
  - statsmodels=0.14.5
  - sqlalchemy=2.0.44
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - psutil=7.1.3
  - pip:
      - HEBO==0.3.6
      - optuna==4.6.0
      - tidyhebo==0.1.0
      # Use the maintained fork required by this benchmark.
      - git+https://github.com/Ch-LZ/bayesmark.git@master
