[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bo-benchmark-core"
version = "0.0.43"
description = "Single-controller Bayesian optimization benchmark runner"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=1.5", "tqdm>=4.60", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bo-benchmark = "bo_benchmark_app.publication:main"

[tool.setuptools.package-data]
bo_benchmark = ["assets/*.json"]

[project.optional-dependencies]
analysis = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.8", "pyarrow>=19,<27", "PyYAML>=6", "ipython>=8", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10"]
